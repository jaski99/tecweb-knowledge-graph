name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install -g pnpm  # Per gestire dipendenze se necessario
      - run: pip install -r requirements.txt
      - run: python scripts/kg.py check
      - run: pytest -q
      # Installa Playwright e dipendenze per test JS
      - run: npm init -y  # Crea package.json se non esiste
      - run: npm install -D playwright  # Installa Playwright
      - run: npx playwright install chromium  # Installa browser
      # Esegue test JS se esistono
      - run: |
          if [ -f "web/tests/test_webapp.py" ]; then
            python -m pytest web/tests/test_webapp.py -v
          fi
      - run: sh web/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
