name: Pages
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa dipendenze Python
        run: pip install -r requirements.txt playwright
      - name: Installa Chromium per Playwright
        run: python -m playwright install --with-deps chromium
      - name: Controlla knowledge graph
        run: python scripts/kg.py check
      - name: Prepara sito statico
        run: sh web/build.sh
      - name: Test dei moduli JavaScript
        shell: bash
        run: |
          set -o pipefail
          npm test --prefix web | tee /tmp/node-output.txt
          if grep -Eq '^# skipped [1-9][0-9]*$' /tmp/node-output.txt; then
            echo "::error::Node ha saltato test: in CI sono richiesti zero test saltati"
            exit 1
          fi
      - name: Test Python ed e2e Playwright
        shell: bash
        run: |
          set +e
          pytest -q --tb=short > /tmp/pytest-output.txt 2>&1
          result=$?
          cat /tmp/pytest-output.txt
          if grep -Eq '(^|, )[1-9][0-9]* skipped([ ,]|$)' /tmp/pytest-output.txt; then
            echo "::error::pytest ha saltato test: in CI sono richiesti zero test saltati"
            result=1
          fi
          if [ "$result" -ne 0 ]; then
            while IFS= read -r failure; do
              echo "::error title=Errore pytest::$failure"
            done < <(grep -E '^(FAILED|ERROR) ' /tmp/pytest-output.txt)
          fi
          exit "$result"
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: web
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
