<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Grafo, percorso topologico, lezioni e ripasso per Tecnologie Web UNIMORE.">
  <meta name="kg-graph-url" content="graph.json ../graph/graph.json">
  <meta name="kg-quiz-url" content="quiz.json ../graph/quiz.json">
  <title>Tecnologie Web — Knowledge graph di studio (UNIMORE)</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    try {
      let tema = localStorage.getItem('ids-kg:tema:v1');
      if (tema !== 'light' && tema !== 'dark') tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = tema;
    } catch (_) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script defer src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script defer src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/dist/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">Vai al contenuto</a>
  <header>
    <div class="head-row">
      <h1>Tecnologie Web · Knowledge graph (UNIMORE)</h1>
      <div id="theme"></div>
    </div>
    <p id="course" class="muted"></p>
    <details class="note"><summary>Come sono state decise le priorità</summary><p id="exam-note"></p></details>
    <nav id="module-nav" class="module-nav" aria-label="Strumenti di studio"></nav>
  </header>
  <div class="layout">
    <aside class="side" aria-label="Filtri e progresso">
      <details open class="panel"><summary><h2>Filtri</h2></summary><div id="filters"></div><p id="count" class="muted" aria-live="polite"></p></details>
      <details open class="panel"><summary><h2>Progresso</h2></summary><div id="progress"></div></details>
    </aside>
    <main id="main">
      <p id="status" role="status">Caricamento…</p>
      <div id="resume" class="resume" aria-label="Riprendi lo studio" hidden></div>
      <div class="tablist" role="tablist" aria-label="Viste del knowledge graph">
        <button role="tab" id="tab-grafo" data-tab="grafo" aria-controls="view-grafo" aria-selected="true">Grafo</button>
        <button role="tab" id="tab-percorso" data-tab="percorso" aria-controls="view-percorso" aria-selected="false" tabindex="-1">Percorso</button>
        <button role="tab" id="tab-ripasso" data-tab="ripasso" aria-controls="view-ripasso" aria-selected="false" tabindex="-1">Ripasso guidato</button>
      </div>
      <section id="view-grafo" role="tabpanel" aria-labelledby="tab-grafo">
        <div class="graph-layout">
          <div>
            <div class="graph-wrap">
              <div class="graph-tools" aria-label="Controlli del grafo">
                <button id="zoom-in" class="btn" type="button" aria-label="Ingrandisci">+</button>
                <button id="zoom-out" class="btn" type="button" aria-label="Riduci">−</button>
                <button id="zoom-fit" class="btn" type="button">Adatta</button>
              </div>
              <div id="cy" role="img" tabindex="0" aria-label="Grafo interattivo; usa le frecce per spostarti e Invio per aprire una lezione."></div>
              <canvas id="minimap" class="minimap" aria-label="Minimappa del grafo"></canvas>
            </div>
            <div id="graph-mobile-list" class="graph-mobile-list"></div>
          </div>
          <aside id="details" class="details" aria-label="Dettagli del nodo selezionato" hidden></aside>
        </div>
      </section>
      <section id="view-percorso" role="tabpanel" aria-labelledby="tab-percorso" hidden>
        <h2>Percorso di studio</h2>
        <p class="muted">Ordine topologico: i prerequisiti precedono i concetti che li richiedono. Puoi spuntare ciò che hai studiato.</p>
        <div id="path"></div>
      </section>
      <section id="view-ripasso" role="tabpanel" aria-labelledby="tab-ripasso" hidden>
        <h2>Checklist di ripasso</h2><div id="review"></div>
      </section>
    </main>
  </div>
  <div id="module-root" hidden></div>
  <div id="lesson" class="lesson-page" hidden></div>
</body>
</html>
